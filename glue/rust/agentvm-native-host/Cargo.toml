[package]
name = "agentvm-native-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = "=2.0.0"
wasmtime = { version = "=49.0.0-rc.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }

[profile.release]
opt-level = 3
panic = "abort"
