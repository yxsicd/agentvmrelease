name: Public repository CDN verification
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
concurrency:
  group: agentvm-cdn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Verify current tree and negative acquisition cases
        run: |
          node scripts/verify-repository-distribution.mjs
          node --test scripts/test-distribution.mjs
      - name: Verify immutable CDN downloads, CORS and actual ELF execution
        run: node scripts/verify-cdn.mjs "${{ github.sha }}" target/cdn-receipt.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-cdn-receipt
          path: target/cdn-receipt.json
          retention-days: 30
          if-no-files-found: error
