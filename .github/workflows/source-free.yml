name: Source-free AgentVM verification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to verify
        required: true
        default: dev
        type: choice
        options: [dev, main, prod]

permissions:
  contents: read

concurrency:
  group: agentvm-source-free-${{ github.workflow }}-${{ github.ref }}-${{ inputs.channel || 'dev' }}
  cancel-in-progress: true

env:
  AGENTVM_CHANNEL: ${{ inputs.channel || 'dev' }}

jobs:
  javascript:
    name: ${{ matrix.runtime }} source-free
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: '2.9.4'
      - name: Download exact public Core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-input target/ci
          curl -fL --retry 3 \
            -o target/release-input/agentvm-core.wasm \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${AGENTVM_CHANNEL}/agentvm-core.wasm"
          node scripts/verify-manifest.mjs \
            "channels/${AGENTVM_CHANNEL}.json" \
            target/release-input/agentvm-core.wasm \
            > "target/ci/manifest-${{ matrix.runtime }}.json"
      - name: Execute source-free real ELF
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.runtime }}" in
            node)
              node glue/js/self-test.mjs target/release-input/agentvm-core.wasm fixtures/exit43.elf \
                | tee target/ci/node.json
              ;;
            bun)
              bun glue/js/self-test.mjs target/release-input/agentvm-core.wasm fixtures/exit43.elf \
                | tee target/ci/bun.json
              ;;
            deno)
              deno run --allow-read glue/js/self-test.mjs target/release-input/agentvm-core.wasm fixtures/exit43.elf \
                | tee target/ci/deno.json
              ;;
          esac
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-js-${{ matrix.runtime }}
          path: target/ci/**
          retention-days: 14
          if-no-files-found: error

  native:
    name: Native Host ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            binary: agentvm-native-host
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            binary: agentvm-native-host
          - platform: macos-arm64
            os: macos-15
            binary: agentvm-native-host
          - platform: windows-x64
            os: windows-2025
            binary: agentvm-native-host.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Select stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Download exact public Core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-input target/ci
          curl -fL --retry 3 \
            -o target/release-input/agentvm-core.wasm \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${AGENTVM_CHANNEL}/agentvm-core.wasm"
          node scripts/verify-manifest.mjs \
            "channels/${AGENTVM_CHANNEL}.json" \
            target/release-input/agentvm-core.wasm \
            > "target/ci/manifest-${{ matrix.platform }}.json"
      - name: Build public Native Host glue
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --manifest-path glue/rust/agentvm-native-host/Cargo.toml
      - name: Verify Wasmi and Wasmtime against the exact Core
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-native.mjs \
            "glue/rust/agentvm-native-host/target/release/${{ matrix.binary }}" \
            target/release-input/agentvm-core.wasm \
            fixtures/exit43.elf \
            | tee "target/ci/native-${{ matrix.platform }}.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-native-${{ matrix.platform }}
          path: target/ci/**
          retention-days: 14
          if-no-files-found: error

  aggregate:
    name: Aggregate verification
    if: always()
    needs: [javascript, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Fail closed and write aggregate receipt
        env:
          AGENTVM_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-summary.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-report
          path: target/ci-aggregate/**
          retention-days: 30
          if-no-files-found: error
